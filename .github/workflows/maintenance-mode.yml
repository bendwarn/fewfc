name: Set Worker maintenance mode

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose Worker should enter or leave maintenance
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Enable or disable maintenance without rebuilding the Worker
        required: true
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

jobs:
  require-main:
    name: Require main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Maintenance mode may only be changed from main; received $GITHUB_REF" >&2
            exit 1
          fi

  set-maintenance:
    name: Set ${{ inputs.environment }} maintenance mode
    needs: require-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - name: Create config-only Worker version
        env:
          MAINTENANCE_MODE_VALUE: ${{ inputs.mode == 'enable' && 'true' || 'false' }}
          VERSION_TAG: fewfc-maintenance-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$MAINTENANCE_MODE_VALUE" | pnpm exec wrangler versions secret put MAINTENANCE_MODE --env "$APP_ENV" --tag "$VERSION_TAG" --message "Set maintenance mode: ${{ inputs.mode }}"
          # The config-only version reuses the currently deployed Worker code/build.
          pnpm exec wrangler versions deploy --env "$APP_ENV" --version-tag "$VERSION_TAG@100%" --message "Set maintenance mode: ${{ inputs.mode }}" -y

name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pnpm-cache-writer
      cancel-in-progress: false
    env:
      APP_ENV: development
      BETTER_AUTH_SECRET: ci-e2e-only-not-for-production-00000000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm exec playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:unit
      - run: bun run typecheck

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
      WORKER_NAME: fewfc-web-staging
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy staging
      - run: bun run build:staging
      - name: Preflight active Worker version and release pair
        id: version_pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          metadata_dir="$(mktemp -d)"
          trap 'rm -rf "$metadata_dir"' EXIT
          bun scripts/worker-version-promotion.ts metadata "$CLOUDFLARE_ACCOUNT_ID" "$WORKER_NAME" "$metadata_dir"
          bun scripts/worker-version-promotion.ts guard "$metadata_dir/deployments.json" "$metadata_dir/versions.json"
          release_json="$(bun scripts/worker-version-promotion.ts release "$metadata_dir/versions.json" "$GITHUB_SHA")"
          release_state="$(jq -r '.state' <<< "$release_json")"
          [[ "$release_state" == "missing" || "$release_state" == "complete" ]]
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"
      - name: Apply migrations and upload paired versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_STATE: ${{ steps.version_pair.outputs.release_state }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-staging --remote --env staging
          normal_tag="fewfc-${GITHUB_SHA}-normal"
          maintenance_tag="fewfc-${GITHUB_SHA}-maintenance"
          if [[ "$RELEASE_STATE" == "missing" ]]; then
            pnpm exec wrangler versions upload worker/index.ts --env staging --assets .output/public --tag "$normal_tag" --var "MAINTENANCE_MODE:false" --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
            pnpm exec wrangler versions upload worker/index.ts --env staging --assets .output/public --tag "$maintenance_tag" --var "MAINTENANCE_MODE:true" --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$RELEASE_STATE" != "complete" ]]; then
            echo "Unexpected release pair state: $RELEASE_STATE" >&2
            exit 1
          fi
          pnpm exec wrangler versions deploy --env staging --version-tag "$normal_tag@100%" --message "Promote paired normal version ${GITHUB_SHA}" -y

  deploy-production:
    name: Deploy production
    needs:
      - deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      WORKER_NAME: fewfc
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy production
      - run: bun run build:production
      - name: Preflight active Worker version and release pair
        id: version_pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          metadata_dir="$(mktemp -d)"
          trap 'rm -rf "$metadata_dir"' EXIT
          bun scripts/worker-version-promotion.ts metadata "$CLOUDFLARE_ACCOUNT_ID" "$WORKER_NAME" "$metadata_dir"
          bun scripts/worker-version-promotion.ts guard "$metadata_dir/deployments.json" "$metadata_dir/versions.json"
          release_json="$(bun scripts/worker-version-promotion.ts release "$metadata_dir/versions.json" "$GITHUB_SHA")"
          release_state="$(jq -r '.state' <<< "$release_json")"
          [[ "$release_state" == "missing" || "$release_state" == "complete" ]]
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"
      - name: Apply migrations and upload paired versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_STATE: ${{ steps.version_pair.outputs.release_state }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-production --remote --env production
          normal_tag="fewfc-${GITHUB_SHA}-normal"
          maintenance_tag="fewfc-${GITHUB_SHA}-maintenance"
          if [[ "$RELEASE_STATE" == "missing" ]]; then
            pnpm exec wrangler versions upload worker/index.ts --env production --assets .output/public --tag "$normal_tag" --var "MAINTENANCE_MODE:false" --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
            pnpm exec wrangler versions upload worker/index.ts --env production --assets .output/public --tag "$maintenance_tag" --var "MAINTENANCE_MODE:true" --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$RELEASE_STATE" != "complete" ]]; then
            echo "Unexpected release pair state: $RELEASE_STATE" >&2
            exit 1
          fi
          pnpm exec wrangler versions deploy --env production --version-tag "$normal_tag@100%" --message "Promote paired normal version ${GITHUB_SHA}" -y

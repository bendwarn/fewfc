name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run typecheck

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      BETTER_AUTH_SECRET: ci-e2e-only-not-for-production-00000000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e:built

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run validate:deploy staging
      - run: bun run build:staging
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: bun
          workingDirectory: apps/web
          environment: staging
          secrets: |
            BETTER_AUTH_SECRET
          command: |
            d1 migrations apply fewfc-auth-staging --remote --env staging
            deploy --env staging
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  deploy-manual:
    name: Deploy ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run validate:deploy ${{ inputs.environment }}
      - run: bun run build:${{ inputs.environment }}
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: bun
          workingDirectory: apps/web
          environment: ${{ inputs.environment }}
          secrets: |
            BETTER_AUTH_SECRET
          command: |
            d1 migrations apply fewfc-auth-${{ inputs.environment }} --remote --env ${{ inputs.environment }}
            deploy --env ${{ inputs.environment }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

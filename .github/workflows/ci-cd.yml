name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging workflow run ID to promote to production
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  web:
    name: Web checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/setup@v2
        with:
          working-directory: apps/web
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: bun run test:unit
      - run: bun run typecheck

  e2e:
    name: Browser E2E
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      BETTER_AUTH_SECRET: ci-e2e-only-not-for-production-00000000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/setup@v2
        with:
          working-directory: apps/web
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm exec playwright install --with-deps chromium
      - run: bun run test:e2e

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/setup@v2
        with:
          working-directory: apps/web
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy staging
      - run: bun run build:staging
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/web
          environment: staging
          command: |
            d1 migrations apply fewfc-auth-staging --remote --env staging
            deploy --env staging

  validate-production:
    name: Validate staging promotion
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      head-sha: ${{ steps.staging-run.outputs.head-sha }}
    steps:
      - name: Validate staging run
        id: staging-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "staging_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "push" and
            .head_branch == "main" and
            .path == ".github/workflows/ci-cd.yml" and
            .head_repository.full_name == $repository
          ' <<<"$run_json" >/dev/null; then
            echo "Run ${RUN_ID} is not a successful main staging run from this workflow" >&2
            exit 1
          fi

          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          if [[ "$head_sha" != "$CURRENT_SHA" ]]; then
            echo "Run ${RUN_ID} tested ${head_sha}, but main is currently ${CURRENT_SHA}" >&2
            exit 1
          fi

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          if ! jq -e '
            .jobs | any(.name == "Deploy staging" and .conclusion == "success")
          ' <<<"$jobs_json" >/dev/null; then
            echo "Run ${RUN_ID} does not contain a successful Deploy staging job" >&2
            exit 1
          fi

          echo "head-sha=${head_sha}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production
    needs:
      - validate-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-production.outputs.head-sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/setup@v2
        with:
          working-directory: apps/web
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy production
      - run: bun run build:production
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/web
          environment: production
          command: |
            d1 migrations apply fewfc-auth-production --remote --env production
            deploy --env production

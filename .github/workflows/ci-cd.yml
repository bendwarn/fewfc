name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the current main revision to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pnpm-cache-writer
      cancel-in-progress: false
    env:
      APP_ENV: development
      BETTER_AUTH_SECRET: ci-e2e-only-not-for-production-00000000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm exec playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:unit
      - run: bun run typecheck

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy staging
      - run: bun run build:staging
      - name: Apply migrations and deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-staging --remote --env staging
          # keep-vars preserves the separately managed MAINTENANCE_MODE secret;
          # an ordinary push must never reopen traffic during maintenance.
          pnpm exec wrangler deploy --env staging --keep-vars --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --message "Deploy staging ${GITHUB_SHA}"

  deploy-production:
    name: Deploy production
    needs:
      - rust
      - web
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy production
      - run: bun run build:production
      - name: Apply migrations and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-production --remote --env production
          # keep-vars preserves the separately managed MAINTENANCE_MODE secret;
          # an ordinary production deploy must never reopen traffic during maintenance.
          pnpm exec wrangler deploy --env production --keep-vars --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --message "Deploy production ${GITHUB_SHA}"

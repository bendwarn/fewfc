name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the current main revision to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_production != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  web:
    name: Web checks
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_production != true
    runs-on: ubuntu-latest
    concurrency:
      group: pnpm-cache-writer
      cancel-in-progress: false
    env:
      APP_ENV: development
      BETTER_AUTH_SECRET: ci-e2e-only-not-for-production-00000000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm exec playwright install --with-deps chromium
      - run: bun run test:storybook
      - run: bun run build:storybook
      - run: bun run test:e2e
      - run: bun run test:unit
      - run: bun run typecheck

  verify-staging:
    name: Verify staging checks for this revision
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the latest main push run for this SHA to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-cd.yml/runs?branch=main&event=push&head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.updated_at) | last | select(.conclusion == "success") | .id // empty')"

          if [[ -z "$run_id" ]]; then
            echo "::error::找不到這個 SHA 對應的成功 main push workflow；請先讓此版本通過 staging。"
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            | jq -e '[.jobs[] | select(.name == "Rust tests" or .name == "Web checks" or .name == "Deploy staging")] | length == 3 and all(.[]; .conclusion == "success")' >/dev/null; then
            echo "::error::此 SHA 的 Rust tests、Web checks 或 Deploy staging 未全部成功。"
            exit 1
          fi

          echo "已驗證 ${GITHUB_SHA} 的 Rust tests、Web checks 與 Deploy staging 均成功。"
          echo "驗證來源：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy staging
      - run: bun run build:staging
      - name: Apply migrations and deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-staging --remote --env staging
          # --keep-vars 保留 Dashboard 獨立管理的 MAINTENANCE_MODE Worker 變數；
          # 維護期間的一般部署不得重新開放流量。
          pnpm exec wrangler deploy --env staging --keep-vars --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --message "Deploy staging ${GITHUB_SHA}"

  deploy-production:
    name: Deploy production
    needs:
      - verify-staging
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
          run_install: |
            - cwd: apps/web
              args: [--frozen-lockfile]
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run validate:deploy production
      - run: bun run build:production
      - name: Apply migrations and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply fewfc-auth-production --remote --env production
          # --keep-vars 保留 Dashboard 獨立管理的 MAINTENANCE_MODE Worker 變數；
          # 維護期間的一般正式環境部署不得重新開放流量。
          pnpm exec wrangler deploy --env production --keep-vars --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --message "Deploy production ${GITHUB_SHA}"

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">五行戰鬥牌</title>
  <desc id="description">五行戰鬥牌的線上多人卡牌對戰分享圖。</desc>
  <defs>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 284) rotate(90) scale(420)">
      <stop stop-color="#C6A35E" stop-opacity=".3"/>
      <stop offset="1" stop-color="#101512" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="80" y1="60" x2="1110" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B231E"/>
      <stop offset="1" stop-color="#0B100D"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" stroke="#E8E4D8" stroke-opacity=".045"/>
    </pattern>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="630" fill="url(#aura)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M65 60H1135V570H65Z" stroke="#C6A35E" stroke-opacity=".18"/>
  <path d="M65 60H255" stroke="#C6A35E" stroke-width="3"/>

  <image href="header-banner.svg" x="86" y="88" width="650" height="103" preserveAspectRatio="xMinYMid meet"/>

  <g transform="translate(93 258)">
    <circle cx="4" cy="4" r="4" fill="#A7A9A4"/>
    <circle cx="20" cy="4" r="4" fill="#5D9B67"/>
    <circle cx="36" cy="4" r="4" fill="#4C87BD"/>
    <circle cx="52" cy="4" r="4" fill="#BD5146"/>
    <circle cx="68" cy="4" r="4" fill="#B8944E"/>
    <text x="92" y="10" fill="#DDC17F" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="700" letter-spacing="4">線上多人卡牌對戰</text>
  </g>

  <text x="86" y="355" fill="#F2EEE3" font-family="Noto Serif TC, PingFang TC, serif" font-size="58" font-weight="900">以牌為陣，決勝五行。</text>
  <text x="90" y="413" fill="#9AA59D" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22">組合陣法、洞察對手，在每一次出牌中掌握戰局。</text>
  <text x="90" y="532" fill="#C6A35E" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="700">fewfc.febcg.workers.dev</text>

  <g filter="url(#cardShadow)">
    <g transform="translate(786 204) rotate(-18 79 120)">
      <image href="cards/metal-1.webp" width="158" height="239" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(846 166) rotate(-8 79 120)">
      <image href="cards/wood-2.webp" width="158" height="239" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(910 149) rotate(2 79 120)">
      <image href="cards/water-3.webp" width="158" height="239" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(971 174) rotate(12 79 120)">
      <image href="cards/fire-4.webp" width="158" height="239" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(1024 222) rotate(21 79 120)">
      <image href="cards/earth-5.webp" width="158" height="239" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>
</svg>

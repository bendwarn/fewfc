name = "fewfc-web"
main = "worker/index.ts"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
BETTER_AUTH_URL = "http://localhost:8787"
MAINTENANCE_MODE = "false"

[secrets]
required = ["BETTER_AUTH_SECRET"]

[assets]
directory = ".output/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fewfc-auth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "PLAYER_NOTIFICATIONS"
class_name = "PlayerNotifications"

[[durable_objects.bindings]]
name = "REPLAY"
class_name = "ReplayArchive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerNotifications"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReplayArchive"]

[env.staging]
name = "fewfc-web-staging"

[env.staging.vars]
APP_ENV = "staging"
BETTER_AUTH_URL = "https://fewfc-web-staging.febcg.workers.dev"

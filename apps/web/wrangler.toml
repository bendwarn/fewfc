[env.staging.secrets]
required = ["BETTER_AUTH_SECRET"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fewfc-auth-staging"
database_id = "b6b2d384-aca2-439f-80af-ff59b9fb2c43"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[env.staging.durable_objects.bindings]]
name = "PLAYER_NOTIFICATIONS"

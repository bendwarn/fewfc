name = "fewfc-web"
main = "worker/index.ts"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
BETTER_AUTH_URL = "http://localhost:8787"

[assets]
directory = ".output/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fewfc-auth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "PLAYER_NOTIFICATIONS"
class_name = "PlayerNotifications"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerNotifications"]

[env.staging]
name = "fewfc-web-staging"

[env.staging.vars]
APP_ENV = "staging"
BETTER_AUTH_URL = "https://staging.example.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fewfc-auth-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[env.staging.durable_objects.bindings]]
name = "PLAYER_NOTIFICATIONS"
class_name = "PlayerNotifications"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerNotifications"]

[env.production]
name = "fewfc-web-production"

[env.production.vars]
APP_ENV = "production"
BETTER_AUTH_URL = "https://example.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "fewfc-auth-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[env.production.durable_objects.bindings]]
name = "PLAYER_NOTIFICATIONS"
class_name = "PlayerNotifications"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerNotifications"]
